name: Release

# Cut from `main`. Build FIRST, release LAST.
#
# semantic-release computes the next version from Conventional Commits in a dry run;
# the Android APKs are built with that version stamped in; and only once they exist
# is the tag + GitHub Release created and the APKs attached. It used to be the other
# way round — the release appeared the moment the version was computed, minutes
# before the APK had even compiled, and a failed build left a release with no APK.
# No commit-back: the version lives in the tag, and is passed to the build with
# `--config` because tauri.conf.json is never rewritten.
#
# Two APKs come out of every release:
#   Pulsar-android.apk              the one to download — no accessibility service.
#   Pulsar-android-hostcontrol.apk  + PulsarA11yService, so a peer can TOUCH this
#                                   phone. Google Play Protect refuses to install an
#                                   app from a browser when its manifest declares an
#                                   accessibility service ("can access sensitive
#                                   information"), so this one is installed over adb.
# The names carry no version so `releases/latest/download/<name>` stays a stable link.
# iOS builds need a macOS runner + Apple signing and are done manually (see README).
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 26.1.10909125
  BUILD_TOOLS: 34.0.0

jobs:
  # 1. Test gate + compute the next version (dry run: no tag or release yet).
  prepare:
    name: Prepare (version + test gate)
    runs-on: ubuntu-22.04
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
      tag: ${{ steps.semrel.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install deps (tauri host build)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libudev-dev librsvg2-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test gate (no version/build/release if these fail)
        # --workspace: the root default-members is the plugin alone, which would skip the
        # mobile shell (host.rs, client.rs …) — the part with all the tests.
        run: cargo test --workspace --locked
      - name: Compute next version (dry run — creates NO tag or release)
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          extra_plugins: |
            conventional-changelog-conventionalcommits@^9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Build both signed APKs with the computed version (only if a release is due).
  android:
    name: Android APKs
    needs: prepare
    if: needs.prepare.outputs.published == 'true'
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install NDK + build tools
        run: sdkmanager "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;${BUILD_TOOLS}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend deps
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Initialize Android project
        working-directory: mobile
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: bun run tauri android init

      # The generated project ships Tauri's own launcher icon; `tauri icon` writes the
      # Pulsar one straight into gen/android's mipmaps when that directory exists (it
      # does, we just created it). Without this step the APK carries the Tauri icon.
      - name: Brand the launcher icon
        working-directory: mobile
        run: bun run tauri icon app-icon.png

      - name: Configure signing keystore
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — a release APK must be signed"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > gen/android/pulsar.keystore
          cat > gen/android/keystore.properties <<PROPS
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storePassword=$ANDROID_STORE_PASSWORD
          storeFile=$(pwd)/gen/android/pulsar.keystore
          PROPS
          # Tauri's generated app/build.gradle.kts has no signingConfig — inject one
          # that reads keystore.properties, so the release APK is signed (not -unsigned).
          python3 scripts/patch-android-signing.py gen/android/app/build.gradle.kts
          # Branded splash (indigo bg + pulse-rings icon + 700ms hold + edge-to-edge) —
          # gen/ is regenerated by init, so this must be re-applied every build.
          python3 scripts/patch-android-splash.py gen/android

      # Both builds share one Rust compile — only the manifest differs between them, so
      # the second `tauri android build` is a re-package, not a rebuild.
      - name: Build host-control APK (with the accessibility service)
        working-directory: mobile
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          bun run tauri android build --apk --config "{\"version\":\"$VERSION\"}"
          mkdir -p ../release-artifacts
          mapfile -t apks < <(find gen/android -path '*release*' -name '*.apk' -type f ! -name '*unsigned*')
          [ ${#apks[@]} -eq 1 ] || { echo "::error::expected exactly one release APK, got: ${apks[*]}"; exit 1; }
          cp "${apks[0]}" ../release-artifacts/Pulsar-android-hostcontrol.apk

      - name: Build default APK (accessibility service stripped)
        working-directory: mobile
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          python3 scripts/patch-android-no-a11y.py gen/android/app/src/main/AndroidManifest.xml
          bun run tauri android build --apk --config "{\"version\":\"$VERSION\"}"
          mapfile -t apks < <(find gen/android -path '*release*' -name '*.apk' -type f ! -name '*unsigned*')
          [ ${#apks[@]} -eq 1 ] || { echo "::error::expected exactly one release APK, got: ${apks[*]}"; exit 1; }
          cp "${apks[0]}" ../release-artifacts/Pulsar-android.apk

      # What we are about to publish, checked against what was asked for: signed by our
      # key, carrying THIS version, and the accessibility service present exactly where
      # it should be. A wrong answer here fails the release instead of shipping.
      - name: Verify the APKs
        run: |
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          check() {  # <apk> <expect accessibility service: yes|no>
            local apk=$1 want=$2
            "$BT/apksigner" verify --print-certs "$apk" | grep -E "^Signer #1 certificate DN"
            local badging; badging=$("$BT/aapt" dump badging "$apk")
            grep -oE "versionName='[^']*'" <<<"$badging"
            grep -q "versionName='$VERSION'" <<<"$badging" \
              || { echo "::error::$apk does not carry version $VERSION"; exit 1; }
            local has=no
            if "$BT/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q BIND_ACCESSIBILITY_SERVICE; then has=yes; fi
            echo "$apk: accessibility service = $has"
            [ "$has" = "$want" ] || { echo "::error::$apk: expected accessibility service = $want"; exit 1; }
          }
          check release-artifacts/Pulsar-android.apk no
          check release-artifacts/Pulsar-android-hostcontrol.apk yes
          ls -la release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: release-artifacts/*.apk
          if-no-files-found: error

  # 3. Everything built → create the tag + GitHub Release, attach the APKs.
  publish:
    name: Publish release
    needs: [prepare, android]
    if: needs.prepare.outputs.published == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-artifacts
      - name: Semantic Release (create tag + GitHub release, no commit)
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@^9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach the APKs to the release
        if: steps.semrel.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la release-artifacts
          gh release upload "${{ steps.semrel.outputs.new_release_git_tag }}" release-artifacts/*.apk --clobber
